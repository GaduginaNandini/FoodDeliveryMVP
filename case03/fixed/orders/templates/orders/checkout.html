{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'restaurant_list' %}">⚡ QuickBite</a>
        <div class="nav-links"><a href="{% url 'view_cart' %}">← Back to Cart</a></div>
    </nav>
    <div class="form-box">
        <h2>Secure Checkout</h2>
        <div style="background: #FFF1F3; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 24px; font-weight: 700; color: var(--primary);">
            Total to Pay: $<span id="pay-total">{{ total }}</span>{% if error %}<div id="form-error" style="color:#b91c1c">{{ error }}</div>{% endif %}
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" required placeholder="+1 (555) 019-2834">
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <textarea name="address" rows="3" required placeholder="Street address, apartment, suite..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Place Order 🚀</button>
        </form>
    </div>
</body>
</html>
